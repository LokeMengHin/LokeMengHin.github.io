<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positivus</title>
    <link rel="stylesheet" href="css/flexbox2.css">
</head>

<body>
    <div>
        <div class="alignstraight aligncenter">
            <div class="logoflex aligncenter">
                <img src="images/logo.png" height="50" alt="Positivus Logo">
            </div>
            <div class="topdetails aligncenter">
                <p>About us</p>
                <p>Services</p>
                <p>Use Cases</p>
                <p>Pricing</p>
                <p>Blog</p>
                <button class="reqbutton">Request a quote</button>
            </div>
        </div>
    </div>
    <div>
        <div class="maincontent aligncenter">
            <div class="leftalign">
                <h1>Navigating the digital landscape for success</h1>
                <p>Our digital marketing agency helps businesses grow and succeed online through a range of services
                    including SEO, PPC, social media marketing, and content creation.
                </p>
                <button class="bookbutton">Book a consultation</button>
            </div>
            <div class="rightalign">
                <img src="images/Illustration.png" width="480" alt="Illustration Design">
            </div>
        </div>
    </div>
    <div class="bottomlogos aligncenter">
        <img src="images/Logotypes.png" height="48" alt="Company Logos">
    </div>
</body>

</html>
